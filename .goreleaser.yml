# GoReleaser configuration for terraform-provider-hyperv.
# Produces the artifact layout the Terraform Registry and Terraform's
# filesystem/network mirrors expect: zip per platform, SHA256SUMS, a detached
# GPG signature of the sums file, and the registry manifest.
version: 2

project_name: terraform-provider-hyperv

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - "-s -w -X main.version={{ .Version }}"
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    binary: "{{ .ProjectName }}_v{{ .Version }}"

archives:
  - formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_SHA256SUMS"
  algorithm: sha256
  extra_files:
    - glob: terraform-registry-manifest.json
      name_template: "{{ .ProjectName }}_{{ .Version }}_manifest.json"

signs:
  - artifacts: checksum
    args:
      - "--batch"
      - "--local-user"
      - "{{ .Env.GPG_FINGERPRINT }}"
      - "--output"
      - "${signature}"
      - "--detach-sign"
      - "${artifact}"

release:
  extra_files:
    - glob: terraform-registry-manifest.json
      name_template: "{{ .ProjectName }}_{{ .Version }}_manifest.json"
  footer: |
    ## Install

    ```sh
    curl -fsSL https://raw.githubusercontent.com/ryanturner03/hyperv-terraform-provider/main/scripts/install.sh | sh -s -- {{ .Tag }}
    ```

    Windows (PowerShell):

    ```powershell
    irm https://raw.githubusercontent.com/ryanturner03/hyperv-terraform-provider/main/scripts/install.ps1 | iex; Install-HypervProvider -Version {{ .Tag }}
    ```

    See the README for `required_providers` configuration.

changelog:
  use: github
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Other
      order: 999
  filters:
    exclude:
      - "^docs"
      - "^test"
      - "^chore"
      - "^ci"
